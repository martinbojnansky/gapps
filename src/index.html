<!doctype html>
<html lang="en">
  <head>
    <?!= include('assets/knockout.html'); ?> <?!=
    include('assets/bootstrap.html'); ?> <?!= include('assets/styles.html'); ?>
    <?!= include('views/calendar-view.html'); ?> <?!=
    include('views/new-ice-bath-view.html'); ?>
  </head>

  <body>
    <div id="app">
      <div data-bind="component: currentView"></div>
    </div>

    <script>
      function AppViewModel() {
        const self = this;

        self.currentView = ko.observable({
          name: 'calendar-view',
          params: { root: self },
        });
        self.calendarId = '<?= calendarId ?>';

        /**
         * Navigates to the given view.
         *
         * @param {string} viewName - The name of the view to navigate to.
         * @example
         * // Navigate to the calendar view
         * self.navigateToView('calendar-view');
         */
        self.navigateToView = function (viewName) {
          self.currentView({
            name: viewName,
            params: { root: self },
          });
        };
      }

      ko.applyBindings(new AppViewModel(), document.querySelector('#app'));
    </script>
  </body>
</html>
